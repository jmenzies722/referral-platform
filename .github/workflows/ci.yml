name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read   # least privilege for the workflow token

jobs:
  checks:
    name: pre-commit (lint, format, secrets, hygiene)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so the secret scan sees every commit
      - uses: astral-sh/setup-uv@v5
      - run: uvx pre-commit run --all-files --show-diff-on-failure

  test-intake:
    name: test (services/intake)
    runs-on: ubuntu-latest
    if: ${{ hashFiles('services/intake/pyproject.toml') != '' }}
    defaults:
      run:
        working-directory: services/intake
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --locked
      - run: uv run pytest -q
